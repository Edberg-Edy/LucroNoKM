# Roda os testes a cada push e a cada pull request.
# Se algum teste falhar, o GitHub marca o commit com um X vermelho.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test
